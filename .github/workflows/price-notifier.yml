name: Price notifier

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Scrape and send current prices to Telegram"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: per-price-notifier-state
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify scrape and Telegram delivery
        if: github.event_name == 'workflow_dispatch' && inputs.test_telegram == true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notifier.py --test-telegram

      - name: Check out durable state
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin price-state >/dev/null 2>&1; then
            git fetch origin price-state
            git worktree add --detach state-store FETCH_HEAD
          else
            git worktree add --detach state-store "$GITHUB_SHA"
            cd state-store
            git switch --orphan price-state
            git rm -rf --ignore-unmatch .
          fi

      - name: Check prices and deliver changes
        id: notifier
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python notifier.py --state state-store/prices.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist successful baselines and alerts
        shell: bash
        run: |
          cd state-store
          if [[ ! -f prices.json ]]; then
            echo "No valid state was produced."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prices.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(state): update tracked prices"
          git push origin HEAD:price-state

      - name: Report notifier failure
        if: steps.notifier.outputs.exit_code != '0'
        run: exit 1
