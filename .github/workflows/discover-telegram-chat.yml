name: Discover Telegram group

on:
  workflow_dispatch:
    inputs:
      confirm_public_output:
        description: "I understand group title and chat ID will appear in public logs"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require explicit public-output consent
        if: inputs.confirm_public_output != true
        run: |
          echo "Stopped: public repository logs expose the group title and chat ID."
          echo "Run discover_chat.py locally for private discovery."
          exit 1

      - uses: actions/checkout@v4

      - name: Show group title and numeric chat ID only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python discover_chat.py
